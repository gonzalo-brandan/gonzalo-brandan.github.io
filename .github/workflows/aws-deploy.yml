name: "Deploy to AWS"
on:
  push:
    branches:
      - main
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE
      - "infra/**"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write # needed to log in to AWS with OIDC

concurrency:
  group: "aws-deploy"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skipped until the repo variables below are set (after `terraform apply`).
    if: vars.AWS_ROLE_ARN != ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Build site
        run: |
          echo "url: \"${{ vars.SITE_URL }}\"" > _config.aws.yml
          bundle exec jekyll b -d _site --config _config.yml,_config.aws.yml
        env:
          JEKYLL_ENV: "production"

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            --disable-external \
            --ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Upload to S3
        run: aws s3 sync _site "s3://${{ vars.S3_BUCKET }}" --delete --cache-control "public, max-age=300"

      - name: Clear CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
